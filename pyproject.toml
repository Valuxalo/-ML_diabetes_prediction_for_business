[project]
name = "bissnes-ml"
version = "0.1.0"
description = ""
authors = [
    {name = "Valuxalo",email = "cleo200997@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "numpy (==2.5.4)",
    "pandas (==3.0.6)",
    "scipy (==1.18.1)",
    "scikit-learn (==1.9.1)",
    "xgboost (==3.4.1)",
    "matplotlib (==3.11.2)",
    "seaborn (==0.13.2)",
    "pillow (==12.3.0)",
    "streamlit (==1.66.0)"
]
[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["D100", "D103"]
fixable = ["ALL"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
